<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamic Energy Shadow Card fixture</title>
  <style>
    :root {
      --primary-color: #315b4c;
      --primary-text-color: #17201c;
      --secondary-text-color: #65716b;
      --card-background-color: #fff;
      --divider-color: #d8dfdb;
      --ha-card-border-radius: 12px;
      --ha-font-family-body: Arial, sans-serif;
      --ha-font-family-code: "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #eef1ef; color: #17201c; font-family: Arial, sans-serif; }
    main { width: min(1180px, 100%); margin: 0 auto; }
    .fixture-meta { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 12px; color: #65716b; font-size: 12px; }
    ha-card { display: block; background: var(--card-background-color); border-radius: var(--ha-card-border-radius); box-shadow: 0 2px 8px rgb(15 28 22 / 8%); }
    #editor-contract { margin-top: 18px; padding: 14px; background: #fff; border: 1px solid #d8dfdb; border-radius: 10px; }
    #editor-contract h2 { margin: 0 0 10px; font-size: 15px; }
    #editor-fields { display: flex; flex-wrap: wrap; gap: 6px; }
    #editor-fields span { padding: 5px 7px; border: 1px solid #d8dfdb; border-radius: 4px; font-size: 11px; }
    @media (max-width: 500px) { body { padding: 10px; } .fixture-meta { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <div class="fixture-meta"><strong>HACS Lovelace browser fixture</strong><span id="fixture-mode">live-plan</span></div>
    <dynamic-energy-shadow-card id="card"></dynamic-energy-shadow-card>
    <dynamic-energy-control-config-card id="control-card" style="display:block;margin-top:18px"></dynamic-energy-control-config-card>
    <dynamic-energy-validation-card id="validation-card" style="display:block;margin-top:18px"></dynamic-energy-validation-card>
    <section id="editor-contract"><h2>Visual editor schema</h2><div id="editor-fields"></div></section>
  </main>
  <script type="module">
    import {
      DynamicEnergyControlConfigCard,
      DynamicEnergyShadowCard,
      DynamicEnergyValidationCard,
    } from "/dist/dynamic-energy-dashboard.js";

    const card = document.getElementById("card");
    const controlCard = document.getElementById("control-card");
    const validationCard = document.getElementById("validation-card");
    const baseConfig = {
      title: "Live shadow-sturing",
      grid_power_entity: "sensor.grid_power",
      pv_power_entity: "sensor.pv_power",
      battery_power_entity: "sensor.battery_power",
      battery_soc_entity: "sensor.battery_soc",
      house_power_entity: "sensor.house_power",
      ev_power_entity: "sensor.ev_power",
      heat_pump_power_entity: "sensor.heat_pump_power",
      import_price_entity: "sensor.import_price",
      export_price_entity: "sensor.export_price",
      plan_entity: "sensor.shadow_plan",
      plan_attribute: "schedule",
      price_attribute: "prices",
      integration_price_attribute: "data",
      peak_limit_kw: 7,
      stale_after_minutes: 10,
      plan_stale_after_hours: 30,
      deviation_warning_kw: 0.5,
      grid_import_positive: true,
      battery_charge_positive: true,
    };

    const makeState = (value, unit, updated, attributes = {}) => ({
      state: String(value),
      last_updated: updated,
      last_changed: updated,
      attributes: { unit_of_measurement: unit, ...attributes },
    });

    function liveStates(stale = false, planStale = stale) {
      const now = new Date();
      const updated = new Date(now.getTime() - (stale ? 45 : 1) * 60000).toISOString();
      const planUpdated = new Date(now.getTime() - (planStale ? 31 * 60 : 1) * 60000).toISOString();
      const start = new Date(Math.floor(now.getTime() / 900000) * 900000);
      const dayStart = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
      const integrationPrices = Array.from({ length: 192 }, (_, index) => ({
        start_time: new Date(dayStart.getTime() + index * 900000).toISOString(),
        end_time: new Date(dayStart.getTime() + (index + 1) * 900000).toISOString(),
        price_per_kwh: 0.16 + Math.sin(index / 7) * 0.11 + (index % 29 === 0 ? -0.04 : 0),
      }));
      const exportPrices = integrationPrices.map((row) => ({
        ...row,
        price_per_kwh: row.price_per_kwh - 0.09,
      }));
      const prices = Array.from({ length: 32 }, (_, index) => ({
        start_utc: new Date(start.getTime() + index * 900000).toISOString(),
        duration_hours: 0.25,
        market_eur_per_mwh: 30 + Math.sin(index / 4) * 75 + index * 2,
        import_eur_per_kwh: 0.08 + Math.sin(index / 4) * 0.08 + index * 0.003,
        export_eur_per_kwh: 0.03 + Math.sin(index / 4) * 0.04,
      }));
      return {
        "sensor.grid_power": makeState(4200, "W", updated, { friendly_name: "Netvermogen" }),
        "sensor.pv_power": makeState(1800, "W", updated, { friendly_name: "PV-vermogen" }),
        "sensor.battery_power": makeState(500, "W", updated, { friendly_name: "Batterijvermogen" }),
        "sensor.battery_soc": makeState(58, "%", updated, { friendly_name: "Batterij-SOC" }),
        "sensor.house_power": makeState(5500, "W", updated, { friendly_name: "Huisvermogen" }),
        "sensor.ev_power": makeState(2200, "W", updated, { friendly_name: "EV-laden" }),
        "sensor.heat_pump_power": makeState(900, "W", updated, { friendly_name: "Warmtepomp" }),
        "sensor.import_price": makeState(0.21, "EUR/kWh", updated, {
          friendly_name: "Afnameprijs",
          data: integrationPrices,
        }),
        "sensor.export_price": makeState(0.041, "EUR/kWh", updated, {
          friendly_name: "Injectieprijs",
          data: exportPrices,
        }),
        "sensor.shadow_plan": makeState("planned", null, planUpdated, {
          mode: "READ_ONLY_SHADOW",
          price_source: "ENTSO-E Transparency Platform Web API",
          price_tariff_version: "ECOPOWER_DBS_2026-08-01",
          price_reference_eur_per_kwh: 0.277,
          prices,
          price_aggregates: {
            daily: [{ period: "2026-10-08", average_eur_per_kwh: 0.18, difference_vs_reference_eur_per_kwh: -0.097, partial_period: false }],
            weekly: [{ period: "2026-W41", average_eur_per_kwh: 0.21, difference_vs_reference_eur_per_kwh: -0.067, partial_period: true }],
            monthly: [{ period: "2026-10", average_eur_per_kwh: 0.24, difference_vs_reference_eur_per_kwh: -0.037, partial_period: true }],
          },
          schedule: [{
            start_utc: start.toISOString(),
            duration_hours: 0.25,
            action: "CHARGE_FROM_GRID",
            reason: "LOW_PRICE; gezamenlijke netruimte blijft beschikbaar",
            planned_grid_import_kw: 3.5,
            planned_grid_export_kw: 0,
            charge_kwh: 0.25,
            discharge_kwh: 0,
          }],
        }),
        "sensor.validation_summary": makeState(now.toISOString().slice(0, 10), null, updated, {
          local_date: now.toISOString().slice(0, 10),
          coverage_percent: 97.5,
          battery_charge_cheap_kwh: 4.2,
          battery_discharge_expensive_kwh: 2.1,
          ev_charge_cheap_kwh: 7.4,
          ev_cheap_share_percent: 82,
          max_grid_import_kw: 6.2,
          collision_intervals: 1,
          matched_intervals: 67,
          deviation_intervals: 4,
          actual_cost_eur: 5.84,
          shadow_cost_eur: 5.31,
        }),
      };
    }

    window.setFixtureMode = (mode) => {
      document.getElementById("fixture-mode").textContent = mode;
      if (mode === "setup") {
        card.setConfig({ title: "Nog te configureren" });
        card.hass = { states: {} };
        return;
      }
      card.setConfig(baseConfig);
      card.hass = { states: liveStates(mode === "stale") };
    };

    const form = DynamicEnergyShadowCard.getConfigForm();
    document.getElementById("editor-fields").innerHTML = form.schema
      .map((field) => `<span>${form.computeLabel(field)}</span>`)
      .join("");
    window.fixtureEditorFieldCount = form.schema.length;
    controlCard.setConfig({
      title: "Dynamic Energy configuratie",
      name_prefix: "Dynamic Energy",
      plan_entity: "sensor.shadow_plan",
      peak_limit_kw: 7,
      battery_soc_entity: "sensor.battery_soc",
      grid_power_entity: "sensor.grid_power",
      grid_import_positive: true,
      ev_power_entity: "sensor.ev_power",
      import_price_entity: "sensor.import_price",
      export_price_entity: "sensor.export_price",
      integration_price_attribute: "data",
      price_stale_after_minutes: 20,
      plan_stale_after_hours: 30,
      sma_controller: "Sunny Home Manager 2.0",
      sma_optimization_goal: "Economisch",
      sma_tariff_type: "Dynamisch · Day-Ahead · BE · EPEX Spot",
      sma_forecast_charging: "OFF",
      sma_grid_charge_soc_percent: 0,
      sma_feed_in_eur_per_kwh: 0.02,
      smappee_mode: "smart",
      smappee_grid_connection: "Driefasig – Delta · 2 × 40 A",
      smappee_capacity_threshold_kw: 5.5,
      smappee_max_current_ampere: 32,
      smappee_offline_fallback_ampere: 8,
      smappee_dynamic_tariff_status: "NOT_VERIFIED",
    });
    const controlHass = (planStale = false) => ({
      states: liveStates(false, planStale),
      callWS: async () => undefined,
      callApi: async () => {
        const error = new Error("not found");
        error.status = 404;
        throw error;
      },
      callService: async () => undefined,
    });
    controlCard.hass = controlHass(false);
    window.setControlFixtureMode = (mode) => {
      controlCard.hass = controlHass(mode === "stale-plan");
    };
    window.fixtureControlEditorFieldCount = DynamicEnergyControlConfigCard.getConfigForm().schema.length;
    validationCard.setConfig({
      title: "Gedragsvalidatie",
      plan_entity: "sensor.shadow_plan",
      grid_power_entity: "sensor.grid_power",
      grid_import_positive: true,
      battery_power_entity: "sensor.battery_power",
      battery_charge_positive: true,
      ev_power_entity: "sensor.ev_power",
      house_power_entity: "sensor.house_power",
      pv_power_entity: "sensor.pv_power",
      heat_pump_power_entity: "sensor.heat_pump_power",
      validation_summary_entity: "sensor.validation_summary",
      import_price_entity: "sensor.import_price",
      export_price_entity: "sensor.export_price",
      integration_price_attribute: "data",
      price_stale_after_minutes: 20,
      peak_limit_kw: 7,
      smappee_capacity_threshold_kw: 5.5,
      activity_threshold_kw: 0.2,
      data_stale_after_minutes: 10,
      plan_stale_after_hours: 30,
      summary_stale_after_hours: 36,
      pilot_status: "COMBINED_OBSERVATION",
    });
    validationCard.hass = { states: liveStates(false, false) };
    window.fixtureValidationEditorFieldCount = DynamicEnergyValidationCard.getConfigForm().schema.length;
    window.setFixtureMode("live-plan");
  </script>
</body>
</html>
